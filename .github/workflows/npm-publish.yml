name: Publish NPM Package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Publish SDK to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      # Extract semver from tag (strips leading "v"), e.g. "v1.1.3" -> "1.1.3"
      - name: Resolve Version from Git Tag
        id: version
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-}"
          # Strip leading 'v' if present
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not determine version from ref: $GITHUB_REF"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved SDK version: $VERSION"

      # Bump sdk/package.json version to match the tag without creating a git commit
      - name: Sync sdk/package.json Version to Tag
        run: |
          cd sdk
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          echo "sdk/package.json is now at $(node -p "require('./package.json').version")"

      - name: Install Dependencies & Build SDK
        run: |
          cd sdk
          npm ci
          npm run build

      - name: Run SDK Tests
        run: |
          cd sdk
          npm test || true

      - name: Publish to NPM
        run: |
          cd sdk
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
