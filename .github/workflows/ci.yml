name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Check syntax
        run: |
          python -m py_compile gaet.py
          echo "Syntax OK"

      - name: Verify man page renders
        run: |
          which groff || sudo apt-get install -y groff
          groff -man -Tascii gaet.1 > /dev/null
          echo "Man page renders OK"
