name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install gaet itself (src-layout) so `import gaet` resolves to the
          # package on all platforms. Also validates packaging in CI.
          pip install -e .

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Check syntax
        run: |
          python -m py_compile gaet.py
          python -m py_compile scripts/service_manager.py
          python -m py_compile scripts/installer.py
          python -m py_compile dashboard/server.py
          echo "Syntax OK"
        shell: bash

      - name: Verify man page renders (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y groff >/dev/null 2>&1 || true
          groff -man -Tascii gaet.1 > /dev/null
          echo "Man page renders OK"

      - name: Verify PowerShell completions syntax
        if: runner.os == 'Windows'
        run: |
          powershell -Command "& { Test-Path completions/gaet.ps1 }"
          echo "PowerShell completions exist"

      - name: Check platform detection
        # src-layout: `gaet` package lives in src/gaet, while gaet.py at repo
        # root is only the entry shim. Insert src/ ahead of cwd so `import gaet`
        # resolves to the package, not the shim file.
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from gaet import IS_LINUX, IS_MACOS, IS_WINDOWS; print(f'Platform: Linux={IS_LINUX}, Mac={IS_MACOS}, Win={IS_WINDOWS}')"
