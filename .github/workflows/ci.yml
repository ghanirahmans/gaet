name: CI

on:
  push:
    branches: [main, "feat/*", "lts/*"]
  pull_request:
    branches: [main, "lts/*"]

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22.x', '1.23.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Go Module Dependencies
        run: go mod verify

      - name: Code Analysis (go vet)
        run: go vet ./...

      - name: Build Binary
        run: go build -v -o gaet ./cmd/gaet

      - name: Run Test Suite
        env:
          CGO_ENABLED: 0
        run: go test -v -count=1 ./tests/...

      - name: Verify Man Page Syntax (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y groff >/dev/null 2>&1 || true
          groff -man -Tascii gaet.1 > /dev/null
          echo "Man page renders OK"

  docs-consistency:
    name: Docs / Code Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Documentation Alignment
        run: |
          bash sandbox/verify-docs.sh

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gaet
          POSTGRES_PASSWORD: gaet
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Verify Go Module Dependencies
        run: go mod verify

      - name: Code Analysis (go vet)
        run: go vet -tags e2e ./tests/e2e/...

      - name: Install PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Create test databases
        run: |
          PGPASSWORD=gaet psql -h localhost -p 5432 -U gaet -d postgres -c "CREATE DATABASE localdb;" || true
          PGPASSWORD=gaet psql -h localhost -p 5432 -U gaet -d postgres -c "CREATE DATABASE remotedb;" || true

      - name: Run E2E Test Suite
        env:
          E2E_LOCAL_URL: postgres://gaet@localhost:5432/localdb?sslmode=disable
          E2E_REMOTE_URL: postgres://gaet@localhost:5432/remotedb?sslmode=disable
          CGO_ENABLED: 0
        run: go test -v -count=1 -timeout 300s -tags e2e ./tests/e2e/...
