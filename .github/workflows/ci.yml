name: CI

on:
  push:
    branches: [main, "feat/*", "lts/*"]
  pull_request:
    branches: [main, "lts/*"]

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22.x', '1.23.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Go Module Dependencies
        run: go mod verify

      - name: Code Analysis (go vet)
        run: go vet ./...

      - name: Build Binary
        run: go build -v -ldflags="-s -w" -o gaet ./cmd/gaet

      - name: Run Test Suite
        run: go test -v -count=1 ./...

      - name: Verify Man Page Syntax (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y groff >/dev/null 2>&1 || true
          groff -man -Tascii gaet.1 > /dev/null
          echo "Man page renders OK"
