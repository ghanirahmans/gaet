name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build Cross-Platform Binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p build
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/gaet-linux-amd64 ./cmd/gaet
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/gaet-linux-arm64 ./cmd/gaet
          
          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/gaet-darwin-amd64 ./cmd/gaet
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/gaet-darwin-arm64 ./cmd/gaet
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/gaet-windows-amd64.exe ./cmd/gaet

          ls -lh build/

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/gaet-linux-amd64
            build/gaet-linux-arm64
            build/gaet-darwin-amd64
            build/gaet-darwin-arm64
            build/gaet-windows-amd64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
