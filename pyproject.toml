[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gaet"
version = "2.0.1"
description = "PostgreSQL Backup & Sync CLI"
requires-python = ">=3.8"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Ghaniyrahmans", url = "https://github.com/ghanirahmans" }]
keywords = ["postgresql", "backup", "sync", "devops", "database", "cli"]

[project.urls]
Homepage = "https://github.com/ghanirahmans/gaet"
Repository = "https://github.com/ghanirahmans/gaet"
Issues = "https://github.com/ghanirahmans/gaet/issues"
Changelog = "https://github.com/ghanirahmans/gaet/blob/master/CHANGELOG.md"

[project.scripts]
gaet = "gaet:main"

[tool.setuptools]
py-modules = ["gaet"]
