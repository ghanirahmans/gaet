[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gaet"
version = "1.0.0"
description = "PostgreSQL Backup & Sync CLI"
requires-python = ">=3.8"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Ghaniyrahmans", email = "ghaniyrahmans@users.noreply.github.com" }]
keywords = ["postgresql", "backup", "sync", "devops", "database", "cli"]

[project.urls]
Homepage = "https://github.com/ghanirahmans/gaet"
Repository = "https://github.com/ghanirahmans/gaet"
Issues = "https://github.com/ghanirahmans/gaet/issues"
Changelog = "https://github.com/ghanirahmans/gaet/blob/master/CHANGELOG.md"

[project.scripts]
gaet = "gaet:main"

[tool.setuptools]
# src-layout: package lives in src/gaet (v3.1). Ensures `pip install .`
# only exposes the gaet package, never stray dirs at repo root.
package-dir = {"" = "src"}
packages = ["gaet"]
